name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and validate (Claude Code ${{ matrix.CLAUDE_CODE_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor, which the plugin needs (2.1.304 or later), and the latest
        # release, the one users run: a change in the mods runtime, its test
        # kit or its types shows up there first.
        CLAUDE_CODE_VERSION: ["2.1.304", "latest"]
    env:
      CLAUDE_CODE_VERSION: ${{ matrix.CLAUDE_CODE_VERSION }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: "Test: run the mod tests"
        run: claude plugin test .

      # Validate. The repository is a marketplace and a plugin. Since 2.1.289,
      # validating a directory that holds both manifests also validates the
      # plugin and its components, the hooks module included.
      - name: "Validate: marketplace, plugin and hooks module (strict)"
        run: claude plugin validate --strict .

      # The directory profile is newer than the floor, so only the latest leg
      # runs it.
      - name: "Validate: directory profile (strict)"
        if: matrix.CLAUDE_CODE_VERSION == 'latest'
        run: claude plugin validate --profile directory --strict .

      - name: "Validate: no color literals outside hooks/theme.ts"
        run: |
          if grep -rnE '#[0-9A-Fa-f]{6}|0x[0-9A-Fa-f]{6}' hooks/ | grep -v '^hooks/theme\.ts:'; then
            echo "::error::Color literals belong in hooks/theme.ts only"
            exit 1
          fi
